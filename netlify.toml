[build]
  # Skip postbuild (copy-standalone-assets) — standalone output is disabled on Netlify
  command = "npm install && next build --webpack"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"

# Netlify Next.js Runtime plugin — handles SSR, API routes, rewrites, middleware
[[plugins]]
  package = "@netlify/plugin-nextjs"

# CORS headers for API routes
[[headers]]
  for = "/v1/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-API-Key"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-API-Key"
